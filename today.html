<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>11月20日（金）のレース一覧</title>
<style>
:root{--bg:#f6f6f4;--card:#fff;--fg:#1d1d1f;--sub:#6e6e73;--line:#e3e3e0;--done:#b8b8b8;--next:#1f6feb;--nextbg:#e8f0fe;--jra:#2e7d32;--nar:#8a5a00;--maru:#c62828}
@media (prefers-color-scheme:dark){:root{--bg:#141414;--card:#1e1e1e;--fg:#ececec;--sub:#9a9a9a;--line:#2e2e2e;--done:#5c5c5c;--next:#7aa7ff;--nextbg:#1b2840;--jra:#81c784;--nar:#e0b060;--maru:#ff6b6b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,"Hiragino Sans",sans-serif}
main{max-width:720px;margin:0 auto;padding:12px 16px 40px}
h1{font-size:19px;margin:6px 0 2px}.note{color:var(--sub);font-size:12px;margin:0 0 14px}
h2{font-size:15px;margin:18px 0 8px;color:var(--sub);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.ven{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}.ven a{color:var(--fg);font-weight:700;text-decoration:none;font-size:16px}
.tag{font-size:11px;padding:1px 6px;border-radius:6px;border:1px solid currentColor}.tag.jra{color:var(--jra)}.tag.nar{color:var(--nar)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-width:44px;text-align:center;padding:4px 6px;border-radius:8px;border:1px solid var(--line);text-decoration:none;color:var(--fg);font-size:13px;line-height:1.2}
.chip small{display:block;color:var(--sub);font-size:10px}
.chip.done{color:var(--done);background:transparent}.chip.done small{color:var(--done)}
.chip.next{border-color:var(--next);background:var(--nextbg)}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:middle}tr:first-child td{border-top:0}
tr{cursor:pointer}td.t{font-variant-numeric:tabular-nums;font-weight:700;width:58px}td.r{width:44px;font-weight:700}
td.nm{color:var(--sub);font-size:13px}td.m{width:52px;text-align:right;font-weight:700;color:var(--maru);white-space:nowrap}
tr.done td{color:var(--done)}tr.done td.m{color:var(--done)}tr.next td{background:var(--nextbg)}tr.next td.t{color:var(--next)}
.mark{color:var(--maru);font-weight:700;font-size:11px}
.res{display:block;font-size:11.5px;color:var(--sub)}tr.done .res{color:var(--sub)}
.pl{color:#1b7f3b;font-weight:700}.mi{color:#b3261e;font-weight:700}
@media (prefers-color-scheme:dark){.pl{color:#6fd18f}.mi{color:#ff8a80}}
tr.done td.m .pl,tr.done td.m .mi{opacity:1}
.sum{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:4px 0 6px;font-size:14px}
.sum b{font-size:18px;font-variant-numeric:tabular-nums}
.stale{background:#fff3cd;color:#664d03;border-radius:8px;padding:8px 10px;font-size:13px;margin-bottom:10px}
@media (prefers-color-scheme:dark){.stale{background:#3a3000;color:#ffe08a}}
</style></head><body><main>
<h1>11月20日（金）のレース一覧</h1>
<p class="note">発走時刻は朝の予習シートのもの（途中の変更は入っていない）。発走時刻を過ぎたレースはグレー、次のレースは青。◎は n09 の判定（地方）。</p>
<div id="stale"></div><div id="sum"></div>
<h2>場ごと</h2><div id="venues"></div>
<h2>発走時刻の順</h2><table id="rows"></table>
</main>
<script>
const D={"date": "2026-11-20", "venues": [{"fn": "20261120_kasamatsu.html", "ven": "笠松", "jra": false, "races": [[1, "10:25"], [2, "10:55"], [3, "11:25"], [4, "11:55"], [5, "12:25"], [6, "12:55"], [7, "13:30"], [8, "14:00"], [9, "14:35"], [10, "15:10"], [11, "15:45"], [12, "16:15"]]}, {"fn": "20261120_sonoda.html", "ven": "園田", "jra": false, "races": [[1, "10:40"], [2, "11:10"], [3, "11:40"], [4, "12:10"], [5, "12:40"], [6, "13:10"], [7, "13:40"], [8, "14:10"], [9, "14:45"], [10, "15:20"], [11, "15:55"], [12, "16:30"]]}, {"fn": "20261120_ooi.html", "ven": "大井", "jra": false, "races": [[1, "14:30"], [2, "15:02"], [3, "15:35"], [4, "16:07"], [5, "16:40"], [6, "17:12"], [7, "17:45"], [8, "18:20"], [9, "18:55"], [10, "19:30"], [11, "20:10"], [12, "20:50"]]}], "rows": [{"R": 1, "post": "10:25", "name": "2歳3組牝馬", "n": 7, "fn": "20261120_kasamatsu.html", "ven": "笠松", "jra": false}, {"R": 1, "post": "10:40", "name": "C3二3歳以上", "n": 10, "fn": "20261120_sonoda.html", "ven": "園田", "jra": false}, {"R": 2, "post": "10:55", "name": "C4組", "n": 10, "fn": "20261120_kasamatsu.html", "ven": "笠松", "jra": false}, {"R": 2, "post": "11:10", "name": "NewBeginning2歳初出走", "n": 6, "fn": "20261120_sonoda.html", "ven": "園田", "jra": false}, {"R": 3, "post": "11:25", "name": "みこちゃんハーフバースデイ記念2歳2", "n": 8, "fn": "20261120_kasamatsu.html", "ven": "笠松", "jra": false}, {"R": 3, "post": "11:40", "name": "C33歳以上", "n": 8, "fn": "20261120_sonoda.html", "ven": "園田", "jra": false}, {"R": 4, "post": "11:55", "name": "辻本プレゼンツ全力疾走杯C3", "n": 10, "fn": "20261120_kasamatsu.html", "ven": "笠松", "jra": false}, {"R": 4, "post": "12:10", "name": "ミラ賞C3一3歳以上", "n": 10, "fn": "20261120_sonoda.html", "ven": "園田", "jra": false}, {"R": 5, "post": "12:25", "name": "おくまさ祝33歳記念B6C2", "n": 10, "fn": "20261120_kasamatsu.html", "ven": "笠松", "jra": false}, {"R": 5, "post": "12:40", "name": "デネブ賞C2一3歳以上", "n": 12, "fn": "20261120_sonoda.html", "ven": "園田", "jra": false}, {"R": 6, "post": "12:55", "name": "楓葉特別C1-1", "n": 10, "fn": "20261120_kasamatsu.html", "ven": "笠松", "jra": false}, {"R": 6, "post": "13:10", "name": "C33歳以上", "n": 12, "fn": "20261120_sonoda.html", "ven": "園田", "jra": false}, {"R": 7, "post": "13:30", "name": "春名芳和還暦おめでとう記念B4", "n": 10, "fn": "20261120_kasamatsu.html", "ven": "笠松", "jra": false}, {"R": 7, "post": "13:40", "name": "2歳特別", "n": 7, "fn": "20261120_sonoda.html", "ven": "園田", "jra": false}, {"R": 8, "post": "14:00", "name": "B5組", "n": 12, "fn": "20261120_kasamatsu.html", "ven": "笠松", "jra": false}, {"R": 8, "post": "14:10", "name": "C3三3歳以上", "n": 9, "fn": "20261120_sonoda.html", "ven": "園田", "jra": false}, {"R": 1, "post": "14:30", "name": "2歳一二", "n": 11, "fn": "20261120_ooi.html", "ven": "大井", "jra": false}, {"R": 9, "post": "14:35", "name": "野山の錦特別2歳1", "n": 8, "fn": "20261120_kasamatsu.html", "ven": "笠松", "jra": false}, {"R": 9, "post": "14:45", "name": "C2二3歳以上", "n": 11, "fn": "20261120_sonoda.html", "ven": "園田", "jra": false}, {"R": 2, "post": "15:02", "name": "スターレット賞2歳選抜牝馬", "n": 11, "fn": "20261120_ooi.html", "ven": "大井", "jra": false}, {"R": 10, "post": "15:10", "name": "チャレンジ2歳・オープン", "n": 10, "fn": "20261120_kasamatsu.html", "ven": "笠松", "jra": false}, {"R": 10, "post": "15:20", "name": "カエデ賞C13歳以上特別", "n": 12, "fn": "20261120_sonoda.html", "ven": "園田", "jra": false}, {"R": 3, "post": "15:35", "name": "ひばり特別2歳一二選抜", "n": 8, "fn": "20261120_ooi.html", "ven": "大井", "jra": false}, {"R": 11, "post": "15:45", "name": "小町花特別C1-2", "n": 12, "fn": "20261120_kasamatsu.html", "ven": "笠松", "jra": false}, {"R": 11, "post": "15:55", "name": "宝塚セイバージャパン認定特別B13歳以上", "n": 11, "fn": "20261120_sonoda.html", "ven": "園田", "jra": false}, {"R": 4, "post": "16:07", "name": "C2二三四", "n": 10, "fn": "20261120_ooi.html", "ven": "大井", "jra": false}, {"R": 12, "post": "16:15", "name": "B級サバイバル選抜", "n": 9, "fn": "20261120_kasamatsu.html", "ven": "笠松", "jra": false}, {"R": 12, "post": "16:30", "name": "NMB48坂下真心ミニマラソン優勝記念C23歳以上特別", "n": 12, "fn": "20261120_sonoda.html", "ven": "園田", "jra": false}, {"R": 5, "post": "16:40", "name": "C2二三四", "n": 14, "fn": "20261120_ooi.html", "ven": "大井", "jra": false}, {"R": 6, "post": "17:12", "name": "C2二三四", "n": 14, "fn": "20261120_ooi.html", "ven": "大井", "jra": false}, {"R": 7, "post": "17:45", "name": "C1三", "n": 9, "fn": "20261120_ooi.html", "ven": "大井", "jra": false}, {"R": 8, "post": "18:20", "name": "バロン賞C1四五六", "n": 13, "fn": "20261120_ooi.html", "ven": "大井", "jra": false}, {"R": 9, "post": "18:55", "name": "C1四五六", "n": 11, "fn": "20261120_ooi.html", "ven": "大井", "jra": false}, {"R": 10, "post": "19:30", "name": "黄葉特別C1四五六選抜", "n": 13, "fn": "20261120_ooi.html", "ven": "大井", "jra": false}, {"R": 11, "post": "20:10", "name": "スポーツニッポン賞B1二B2二選抜特別", "n": 16, "fn": "20261120_ooi.html", "ven": "大井", "jra": false}, {"R": 12, "post": "20:50", "name": "神楽月賞B2三選抜特別", "n": 14, "fn": "20261120_ooi.html", "ven": "大井", "jra": false}]};
let maru={}, res={};
function now(){return new Date()}
function at(p){const [h,m]=p.split(':').map(Number);const d=new Date(D.date+'T00:00:00');d.setHours(h,m,0,0);return d}
function key(v,r){return v+'|'+r}
function draw(){
  const t=now(), today=t.toISOString().slice(0,10)===D.date||(t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0'))===D.date;
  document.getElementById('stale').innerHTML=today?'':'<div class="stale">このページは '+D.date+' の分です（今日の分はまだ作られていません）</div>';
  const nextRow=D.rows.find(x=>at(x.post)>t);
  const nk=nextRow?key(nextRow.ven,nextRow.R):'';
  let h='';
  for(const v of D.venues){
    h+='<div class="card"><div class="ven"><a href="'+v.fn+'">'+v.ven+'</a><span class="tag '+(v.jra?'jra':'nar')+'">'+(v.jra?'中央':'地方')+'</span></div><div class="chips">';
    for(const [r,p] of v.races){
      const k=key(v.ven,r), c=at(p)<=t?'done':(k===nk?'next':''), m=maru[k];
      h+='<a class="chip '+c+'" href="'+v.fn+'#R'+r+'">'+r+'R'+(m&&m.s.startsWith('◎')?'<span class="mark">◎</span>':'')+'<small>'+p+'</small></a>';
    }
    h+='</div></div>';
  }
  document.getElementById('venues').innerHTML=h;
  let rows='';
  for(const x of D.rows){
    const k=key(x.ven,x.R), c=at(x.post)<=t?'done':(k===nk?'next':''), m=maru[k];
    rows+='<tr class="'+c+'" onclick="location.href=\''+x.fn+'#R'+x.R+'\'"><td class="t">'+x.post+'</td><td>'+x.ven+'</td><td class="r">'+x.R+'R</td><td class="nm">'+(x.name||'')+(x.n?'・'+x.n+'頭':'')+(res[k]?'<span class="res">結果 '+res[k].top.join('-')+'</span>':'')+'</td><td class="m">'+cell(k,m)+'</td></tr>';
  }
  document.getElementById('rows').innerHTML=rows;
  let n=0,cost=0,ret=0,wait=0,hit=0;
  for(const k in maru){const m=maru[k];if(!m.final||!m.bets.length)continue;const p=pl(k);if(!p){wait++;continue}n++;cost+=p.cost;ret+=p.ret;if(p.ret>0)hit++}
  document.getElementById('sum').innerHTML=(n||wait)?'<div class="sum">今日の◎（確定したもの）　'+(n?'<b class="'+(ret>=cost?'pl':'mi')+'">'+(ret>=cost?'+':'−')+Math.abs(ret-cost).toLocaleString()+'円</b>　'+n+'レース（的中 '+hit+'）・投資 '+cost.toLocaleString()+'円・払戻 '+ret.toLocaleString()+'円・回収率 '+Math.round(ret/cost*100)+'%':'')+(wait?'　結果待ち '+wait+'レース':'')+'<br><span class="res">確定した◎の買い目と金額で計算（楽天で買えなかったレースも含む）</span></div>':'';
}
function pl(k){const m=maru[k],r=res[k];if(!m||!m.final||!m.bets.length||!r)return null;let cost=0,ret=0;
  for(const b of m.bets){cost+=b.yen;ret+=Math.round((r.wide[b.kumi[0]+'-'+b.kumi[1]]||0)*b.yen/100)}return {cost,ret}}
function cell(k,m){if(!m)return '';const p=pl(k);if(!p)return m.s;
  return p.ret>0?'<span class="pl">的中<br>+'+(p.ret-p.cost).toLocaleString()+'</span>':'<span class="mi">外れ<br>−'+p.cost.toLocaleString()+'</span>'}
async function loadMaru(){
  try{
    const j=await (await fetch('live/buy_nar.json?t='+Date.now(),{cache:'no-store'})).json();
    if(j.date!==D.date) return;
    const m={};
    for(const r of j.races||[]){
      const n=(r.bets||[]).length;
      m[key(r.venue,r.race_no)]={s: r.final?(n?'◎確定'+n:'見送り'):(n?'◎予告'+n:''), final:!!r.final,
        bets:(r.bets||[]).map(b=>({kumi:[...b.kumi].sort((a,c)=>a-c),yen:b.yen||1000}))};
    }
    maru=m;
  }catch(e){}
}
async function loadRes(){
  try{
    const j=await (await fetch('live/results_nar.json?t='+Date.now(),{cache:'no-store'})).json();
    if(j.date!==D.date) return;
    const m={};
    for(const r of j.races||[]){const w={};for(const [a,b,p] of r.wide||[])w[Math.min(a,b)+'-'+Math.max(a,b)]=p;m[key(r.venue,r.race_no)]={top:r.top||[],wide:w}}
    res=m;
  }catch(e){}
}
draw();Promise.all([loadMaru(),loadRes()]).then(draw);
setInterval(draw,30000);setInterval(()=>Promise.all([loadMaru(),loadRes()]).then(draw),120000);
</script></body></html>

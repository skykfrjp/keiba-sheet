<style>

.chip small{display:block;color:var(--sub);font-size:10px}
.chip.done{color:var(--done);background:transparent}.chip.done small{color:var(--done)}
.chip.next{border-color:var(--next);background:var(--nextbg)}

tr.done td{color:var(--done)}tr.done td.m{color:var(--done)}tr.next td{background:var(--nextbg)}tr.next td.t{color:var(--next)}
.mark{color:var(--maru);font-weight:700;font-size:11px}
.res{display:block;font-size:11.5px;color:var(--sub)}tr.done .res{color:var(--sub)}
.pl{color:#1b7f3b;font-weight:700}.mi{color:#b3261e;font-weight:700}
@media (prefers-color-scheme:dark){.pl{color:#6fd18f}.mi{color:#ff8a80}}
tr.done td.m .pl,tr.done td.m .mi{opacity:1}
.sum{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:4px 0 6px;font-size:14px}
.sum b{font-size:18px;font-variant-numeric:tabular-nums}
.stale{background:#fff3cd;color:#664d03;border-radius:8px;padding:8px 10px;font-size:13px;margin-bottom:10px}
@media (prefers-color-scheme:dark){.stale{background:#3a3000;color:#ffe08a}}

 "jra": true}, {"R": 7, "post": "13:10", "name": "", "n": 16, "fn": "20261121_fukushima.html", "ven": "福島", "jra": true}, {"R": 7, "post": "13:25", "name": "", "n": 16, "fn": "20261121_kyoto.html", "ven": "京都", "jra": true}, {"R": 8, "post": "13:40", "name": "", "n": 16, "fn": "20261121_fukushima.html", "ven": "福島", "jra": true}, {"R": 8, "post": "13:55", "name": "", "n": 15, "fn": "20261121_kyoto.html", "ven": "京都", "jra": true}, {"R": 9, "post": "14:10", "name": "", "n": 16, "fn": "20261121_fukushima.html", "ven": "福島", "jra": true}, {"R": 9, "post": "14:25", "name": "", "n": 8, "fn": "20261121_kyoto.html", "ven": "京都", "jra": true}, {"R": 10, "post": "14:45", "name": "", "n": 16, "fn": "20261121_fukushima.html", "ven": "福島", "jra": true}, {"R": 1, "post": "14:55", "name": "C3-13", "n": 8, "fn": "20261121_kochi.html", "ven": "高知", "jra": false}, {"R": 10, "post": "15:00", "name": "", "n": 15, "fn": "20261121_kyoto.html", "ven": "京都", "jra": true}, {"R": 11, "post": "15:20", "name": "", "n": 16, "fn": "20261121_fukushima.html", "ven": "福島", "jra": true}, {"R": 1, "post": "15:25", "name": "パッカルくんのおとしもの賞2歳-2組", "n": 11, "fn": "20261121_saga.html", "ven": "佐賀", "jra": false}, {"R": 2, "post": "15:30", "name": "C3-12", "n": 11, "fn": "20261121_kochi.html", "ven": "高知", "jra": false}, {"R": 11, "post": "15:40", "name": "", "n": 16, "fn": "20261121_kyoto.html", "ven": "京都", "jra": true}, {"R": 2, "post": "15:55", "name": "C2-19組", "n": 12, "fn": "20261121_saga.html", "ven": "佐賀", "jra": false}, {"R": 12, "post": "15:55", "name": "", "n": 16, "fn": "20261121_fukushima.html", "ven": "福島", "jra": true}, {"R": 3, "post": "16:05", "name": "C3-11", "n": 10, "fn": "20261121_kochi.html", "ven": "高知", "jra": false}, {"R": 12, "post": "16:20", "name": "", "n": 13, "fn": "20261121_kyoto.html", "ven": "京都", "jra": true}, {"R": 3, "post": "16:30", "name": "C2-22組", "n": 8, "fn": "20261121_saga.html", "ven": "佐賀", "jra": false}, {"R": 4, "post": "16:40", "name": "宗田節特別C3-10", "n": 9, "fn": "20261121_kochi.html", "ven": "高知", "jra": false}, {"R": 4, "post": "17:05", "name": "ノベンバー特選C1", "n": 10, "fn": "20261121_saga.html", "ven": "佐賀", "jra": false}, {"R": 5, "post": "17:15", "name": "仁淀川特別3歳以上B級以下", "n": 12, "fn": "20261121_kochi.html", "ven": "高知", "jra": false}, {"R": 5, "post": "17:35", "name": "C2-21組", "n": 11, "fn": "20261121_saga.html", "ven": "佐賀", "jra": false}, {"R": 6, "post": "17:45", "name": "NKP特別C3-9", "n": 11, "fn": "20261121_kochi.html", "ven": "高知", "jra": false}, {"R": 6, "post": "18:10", "name": "C1-4組", "n": 11, "fn": "20261121_saga.html", "ven": "佐賀", "jra": false}, {"R": 7, "post": "18:15", "name": "高知ユナイテッドSC特別C3-8", "n": 9, "fn": "20261121_kochi.html", "ven": "高知", "jra": false}, {"R": 7, "post": "18:40", "name": "C1-3組", "n": 11, "fn": "20261121_saga.html", "ven": "佐賀", "jra": false}, {"R": 8, "post": "18:45", "name": "C3-7", "n": 10, "fn": "20261121_kochi.html", "ven": "高知", "jra": false}, {"R": 8, "post": "19:10", "name": "AIパッカル賞B-3組", "n": 10, "fn": "20261121_saga.html", "ven": "佐賀", "jra": false}, {"R": 9, "post": "19:20", "name": "B-4", "n": 11, "fn": "20261121_kochi.html", "ven": "高知", "jra": false}, {"R": 9, "post": "19:40", "name": "世界ハロー・デー賞A2・B", "n": 10, "fn": "20261121_saga.html", "ven": "佐賀", "jra": false}, {"R": 10, "post": "19:50", "name": "B-3", "n": 10, "fn": "20261121_kochi.html", "ven": "高知", "jra": false}, {"R": 10, "post": "20:10", "name": "SAGAリベンジャーズドリームC2-23組", "n": 10, "fn": "20261121_saga.html", "ven": "佐賀", "jra": false}, {"R": 11, "post": "20:20", "name": "B-2", "n": 11, "fn": "20261121_kochi.html", "ven": "高知", "jra": false}, {"R": 11, "post": "20:40", "name": "SAGAリベFEVER14C2-20組", "n": 14, "fn": "20261121_saga.html", "ven": "佐賀", "jra": false}, {"R": 12, "post": "20:50", "name": "ファイナルレースC3-20記者選抜", "n": 12, "fn": "20261121_kochi.html", "ven": "高知", "jra": false}]};
let maru={}, res={}, bought=null;
function now(){return new Date()}
function at(p){const [h,m]=p.split(':').map(Number);const d=new Date(D.date+'T00:00:00');d.setHours(h,m,0,0);return d}
function key(v,r){return v+'|'+r}
function draw(){
  const t=now(), today=t.toISOString().slice(0,10)===D.date||(t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0'))===D.date;
  document.getElementById('stale').innerHTML=today?'':'<div class="stale">このページは '+D.date+' の分です（今日の分はまだ作られていません）</div>';
  const nextRow=D.rows.find(x=>at(x.post)>t);
  const nk=nextRow?key(nextRow.ven,nextRow.R):'';
  let h='';
  for(const v of D.venues){
    h+='<div class="card"><div class="ven"><a href="'+v.fn+'">'+v.ven+'</a><span class="tag '+(v.jra?'jra':'nar')+'">'+(v.jra?'中央':'地方')+'</span></div><div class="chips">';
    for(const [r,p] of v.races){
      const k=key(v.ven,r), c=at(p)<=t?'done':(k===nk?'next':''), m=maru[k];
      h+='<a class="chip '+c+'" href="'+v.fn+'#R'+r+'">'+r+'R'+(m&&m.s.startsWith('◎')?'<span class="mark">◎</span>':'')+'<small>'+p+'</small></a>';
    }
    h+='</div></div>';
  }
  document.getElementById('venues').innerHTML=h;
  let rows='';
  for(const x of D.rows){
    const k=key(x.ven,x.R), c=at(x.post)<=t?'done':(k===nk?'next':''), m=maru[k];
    rows+='<tr class="'+c+'" onclick="location.href=\''+x.fn+'#R'+x.R+'\'"><td class="t">'+x.post+'</td><td>'+x.ven+'</td><td class="r">'+x.R+'R</td><td class="nm">'+(x.name||'')+(x.n?'・'+x.n+'頭':'')+(res[k]?'<span class="res">結果 '+res[k].top.join('-')+'</span>':'')+'</td><td class="m">'+cell(k,m)+'</td></tr>';
  }
  document.getElementById('rows').innerHTML=rows;
  let n=0,cost=0,ret=0,wait=0,hit=0;
  let miss=0;
  for(const k in maru){const m=maru[k];if(!m.final||!m.bets.length)continue;const p=pl(k);if(!p){wait++;continue}if(p.none){miss++;continue}n++;cost+=p.cost;ret+=p.ret;if(p.ret>0)hit++}
  document.getElementById('sum').innerHTML=(n||wait)?'<div class="sum">今日の◎（確定したもの）　'+(n?'<b class="'+(ret>=cost?'pl':'mi')+'">'+(ret>=cost?'+':'−')+Math.abs(ret-cost).toLocaleString()+'円</b>　'+n+'レース（的中 '+hit+'）・投資 '+cost.toLocaleString()+'円・払戻 '+ret.toLocaleString()+'円・回収率 '+Math.round(ret/cost*100)+'%':'')+(wait?'　結果待ち '+wait+'レース':'')+(miss?'　買えなかった '+miss+'レース':'')+'<br><span class="res">'+(bought?'楽天で実際に買った記録（n59）で計算':'確定した◎の買い目と金額で計算（実際の購入記録がまだ届いていない）')+'</span></div>':'';
}
function betsOf(k){const m=maru[k];if(!m||!m.final||!m.bets.length)return null;
  if(bought)return bought[k]||[];             /* 実際に買った記録があれば、そちらを使う（買えなかったレースは0円） */
  return m.bets}
function pl(k){const bs=betsOf(k),r=res[k];if(!bs||!r)return null;let cost=0,ret=0;
  for(const b of bs){cost+=b.yen;ret+=Math.round((r.wide[b.kumi[0]+'-'+b.kumi[1]]||0)*b.yen/100)}return {cost,ret,none:!bs.length}}
function cell(k,m){if(!m)return '';const p=pl(k);if(!p)return m.s;if(p.none)return '<span class="res">買えず</span>';
  return p.ret>0?'<span class="pl">的中<br>+'+(p.ret-p.cost).toLocaleString()+'</span>':'<span class="mi">外れ<br>−'+p.cost.toLocaleString()+'</span>'}
async function loadMaru(){
  try{
    const j=await (await fetch('live/buy_nar.json?t='+Date.now(),{cache:'no-store'})).json();
    if(j.date!==D.date) return;
    const m={};
    for(const r of j.races||[]){
      const n=(r.bets||[]).length;
      m[key(r.venue,r.race_no)]={s: r.final?(n?'◎確定'+n:'見送り'):(n?'◎予告'+n:''), final:!!r.final,
        bets:(r.bets||[]).map(b=>({kumi:[...b.kumi].sort((a,c)=>a-c),yen:b.yen||1000}))};
    }
    maru=m;
  }catch(e){}
}
async function loadBought(){
  try{
    const j=await (await fetch('live/bought_nar.json?t='+Date.now(),{cache:'no-store'})).json();
    if(j.date!==D.date) return;
    const m={};
    for(const r of j.races||[])m[key(r.venue,r.race_no)]=(r.bets||[]).map(b=>({kumi:[...b.kumi].sort((a,c)=>a-c),yen:b.yen}));
    bought=m;
  }catch(e){}
}
async function loadRes(){
  try{
    const j=await (await fetch('live/results_nar.json?t='+Date.now(),{cache:'no-store'})).json();
    if(j.date!==D.date) return;
    const m={};
    for(const r of j.races||[]){const w={};for(const [a,b,p] of r.wide||[])w[Math.min(a,b)+'-'+Math.max(a,b)]=p;m[key(r.venue,r.race_no)]={top:r.top||[],wide:w}}
    res=m;
  }catch(e){}
}
draw();Promise.all([loadMaru(),loadRes(),loadBought()]).then(draw);
setInterval(draw,30000);setInterval(()=>Promise.all([loadMaru(),loadRes(),loadBought()]).then(draw),120000);
</script></body></html>

let maru={}, res={}, bought=null;
function now(){return new Date()}
function at(p){const [h,m]=p.split(':').map(Number);const d=new Date(D.date+'T00:00:00');d.setHours(h,m,0,0);return d}
function key(v,r){return v+'|'+r}
function draw(){
  const t=now(), today=t.toISOString().slice(0,10)===D.date||(t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0'))===D.date;
  document.getElementById('stale').innerHTML=today?'':'<div class="stale">このページは '+D.date+' の分です（今日の分はまだ作られていません）</div>';
  const nextRow=D.rows.find(x=>at(x.post)>t);
  const nk=nextRow?key(nextRow.ven,nextRow.R):'';
  let h='';
  for(const v of D.venues){
    h+='<div class="card"><div class="ven"><a href="'+v.fn+'">'+v.ven+'</a><span class="tag '+(v.jra?'jra':'nar')+'">'+(v.jra?'中央':'地方')+'</span></div><div class="chips">';
    for(const [r,p] of v.races){
      const k=key(v.ven,r), c=at(p)<=t?'done':(k===nk?'next':''), m=maru[k];
      h+='<a class="chip '+c+'" href="'+v.fn+'#R'+r+'">'+r+'R'+(m&&m.s.startsWith('◎')?'<span class="mark">◎</span>':'')+'<small>'+p+'</small></a>';
    }
    h+='</div></div>';
  }
  document.getElementById('venues').innerHTML=h;
  let rows='';
  for(const x of D.rows){
    const k=key(x.ven,x.R), c=at(x.post)<=t?'done':(k===nk?'next':''), m=maru[k];
    rows+='<tr class="'+c+'" onclick="location.href=\''+x.fn+'#R'+x.R+'\'"><td class="t">'+x.post+'</td><td>'+x.ven+'</td><td class="r">'+x.R+'R</td><td class="nm">'+(x.name||'')+(x.n?'・'+x.n+'頭':'')+(res[k]?'<span class="res">結果 '+res[k].top.join('-')+'</span>':'')+'</td><td class="m">'+cell(k,m)+'</td></tr>';
  }
  document.getElementById('rows').innerHTML=rows;
  let n=0,cost=0,ret=0,wait=0,hit=0;
  let miss=0;
  for(const k in maru){const m=maru[k];if(!m.final||!m.bets.length)continue;const p=pl(k);if(!p){wait++;continue}if(p.none){miss++;continue}n++;cost+=p.cost;ret+=p.ret;if(p.ret>0)hit++}
  document.getElementById('sum').innerHTML=(n||wait)?'<div class="sum">今日の◎（確定したもの）　'+(n?'<b class="'+(ret>=cost?'pl':'mi')+'">'+(ret>=cost?'+':'−')+Math.abs(ret-cost).toLocaleString()+'円</b>　'+n+'レース（的中 '+hit+'）・投資 '+cost.toLocaleString()+'円・払戻 '+ret.toLocaleString()+'円・回収率 '+Math.round(ret/cost*100)+'%':'')+(wait?'　結果待ち '+wait+'レース':'')+(miss?'　買えなかった '+miss+'レース':'')+'<br><span class="res">'+(bought?'楽天で実際に買った記録（n59）で計算':'確定した◎の買い目と金額で計算（実際の購入記録がまだ届いていない）')+'</span></div>':'';
}
function betsOf(k){const m=maru[k];if(!m||!m.final||!m.bets.length)return null;
  if(bought)return bought[k]||[];             /* 実際に買った記録があれば、そちらを使う（買えなかったレースは0円） */
  return m.bets}
function pl(k){const bs=betsOf(k),r=res[k];if(!bs||!r)return null;let cost=0,ret=0;
  for(const b of bs){cost+=b.yen;ret+=Math.round((r.wide[b.kumi[0]+'-'+b.kumi[1]]||0)*b.yen/100)}return {cost,ret,none:!bs.length}}
function cell(k,m){if(!m)return '';const p=pl(k);if(!p)return m.s;if(p.none)return '<span class="res">買えず</span>';
  return p.ret>0?'<span class="pl">的中<br>+'+(p.ret-p.cost).toLocaleString()+'</span>':'<span class="mi">外れ<br>−'+p.cost.toLocaleString()+'</span>'}
async function loadMaru(){
  try{
    const j=await (await fetch('live/buy_nar.json?t='+Date.now(),{cache:'no-store'})).json();
    if(j.date!==D.date) return;
    const m={};
    for(const r of j.races||[]){
      const n=(r.bets||[]).length;
      m[key(r.venue,r.race_no)]={s: r.final?(n?'◎確定'+n:'見送り'):(n?'◎予告'+n:''), final:!!r.final,
        bets:(r.bets||[]).map(b=>({kumi:[...b.kumi].sort((a,c)=>a-c),yen:b.yen||1000}))};
    }
    maru=m;
  }catch(e){}
}
async function loadBought(){
  try{
    const j=await (await fetch('live/bought_nar.json?t='+Date.now(),{cache:'no-store'})).json();
    if(j.date!==D.date) return;
    const m={};
    for(const r of j.races||[])m[key(r.venue,r.race_no)]=(r.bets||[]).map(b=>({kumi:[...b.kumi].sort((a,c)=>a-c),yen:b.yen}));
    bought=m;
  }catch(e){}
}
async function loadRes(){
  try{
    const j=await (await fetch('live/results_nar.json?t='+Date.now(),{cache:'no-store'})).json();
    if(j.date!==D.date) return;
    const m={};
    for(const r of j.races||[]){const w={};for(const [a,b,p] of r.wide||[])w[Math.min(a,b)+'-'+Math.max(a,b)]=p;m[key(r.venue,r.race_no)]={top:r.top||[],wide:w}}
    res=m;
  }catch(e){}
}
draw();Promise.all([loadMaru(),loadRes(),loadBought()]).then(draw);
setInterval(draw,30000);setInterval(()=>Promise.all([loadMaru(),loadRes(),loadBought()]).then(draw),120000);

let maru={};
function now(){return new Date()}
function at(p){const [h,m]=p.split(':').map(Number);const d=new Date(D.date+'T00:00:00');d.setHours(h,m,0,0);return d}
function key(v,r){return v+'|'+r}
function draw(){
  const t=now(), today=t.toISOString().slice(0,10)===D.date||(t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0'))===D.date;
  document.getElementById('stale').innerHTML=today?'':'<div class="stale">このページは '+D.date+' の分です（今日の分はまだ作られていません）</div>';
  const nextRow=D.rows.find(x=>at(x.post)>t);
  const nk=nextRow?key(nextRow.ven,nextRow.R):'';
  let h='';
  for(const v of D.venues){
    h+='<div class="card"><div class="ven"><a href="'+v.fn+'">'+v.ven+'</a><span class="tag '+(v.jra?'jra':'nar')+'">'+(v.jra?'中央':'地方')+'</span></div><div class="chips">';
    for(const [r,p] of v.races){
      const k=key(v.ven,r), c=at(p)<=t?'done':(k===nk?'next':''), m=maru[k];
      h+='<a class="chip '+c+'" href="'+v.fn+'#R'+r+'">'+r+'R'+(m&&m.s.startsWith('◎')?'<span class="mark">◎</span>':'')+'<small>'+p+'</small></a>';
    }
    h+='</div></div>';
  }
  document.getElementById('venues').innerHTML=h;
  let rows='';
  for(const x of D.rows){
    const k=key(x.ven,x.R), c=at(x.post)<=t?'done':(k===nk?'next':''), m=maru[k];
    rows+='<tr class="'+c+'" onclick="location.href=\''+x.fn+'#R'+x.R+'\'"><td class="t">'+x.post+'</td><td>'+x.ven+'</td><td class="r">'+x.R+'R</td><td class="nm">'+(x.name||'')+(x.n?'・'+x.n+'頭':'')+'</td><td class="m">'+(m?m.s:'')+'</td></tr>';
  }
  document.getElementById('rows').innerHTML=rows;
}
async function loadMaru(){
  try{
    const j=await (await fetch('live/buy_nar.json?t='+Date.now(),{cache:'no-store'})).json();
    if(j.date!==D.date) return;
    const m={};
    for(const r of j.races||[]){
      const n=(r.bets||[]).length;
      m[key(r.venue,r.race_no)]={s: r.final?(n?'◎確定'+n:'見送り'):(n?'◎予告'+n:'')};
    }
    maru=m;
  }catch(e){}
}
draw();loadMaru().then(draw);
setInterval(draw,30000);setInterval(()=>loadMaru().then(draw),120000);

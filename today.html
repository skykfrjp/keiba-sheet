<style>
:root{--bg:#f6f6f4;--card:#fff;--fg:#1d1d1f;--sub:#6e6e73;--line:#e3e3e0;--done:#b8b8b8;--next:#1f6feb;--nextbg:#e8f0fe;--jra:#2e7d32;--nar:#8a5a00;--maru:#c62828}
@media (prefers-color-scheme:dark){:root{--bg:#141414;--card:#1e1e1e;--fg:#ececec;--sub:#9a9a9a;--line:#2e2e2e;--done:#5c5c5c;--next:#7aa7ff;--nextbg:#1b2840;--jra:#81c784;--nar:#e0b060;--maru:#ff6b6b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,"Hiragino Sans",sans-serif}
main{max-width:720px;margin:0 auto;padding:12px 16px 40px}
h1{font-size:19px;margin:6px 0 2px}.note{color:var(--sub);font-size:12px;margin:0 0 14px}
h2{font-size:15px;margin:18px 0 8px;color:var(--sub);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.ven{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}.ven a{color:var(--fg);font-weight:700;text-decoration:none;font-size:16px}
.tag{font-size:11px;padding:1px 6px;border-radius:6px;border:1px solid currentColor}.tag.jra{color:var(--jra)}.tag.nar{color:var(--nar)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-width:44px;text-align:center;padding:4px 6px;border-radius:8px;border:1px solid var(--line);text-decoration:none;color:var(--fg);font-size:13px;line-height:1.2}
.chip small{display:block;color:var(--sub);font-size:10px}
.chip.done{color:var(--done);background:transparent}.chip.done small{color:var(--done)}
.chip.next{border-color:var(--next);background:var(--nextbg)}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:middle}tr:first-child td{border-top:0}
tr{cursor:pointer}td.t{font-variant-numeric:tabular-nums;font-weight:700;width:58px}td.r{width:44px;font-weight:700}
td.nm{color:var(--sub);font-size:13px}td.m{width:52px;text-align:right;font-weight:700;color:var(--maru);white-space:nowrap}
tr.done td{color:var(--done)}tr.done td.m{color:var(--done)}tr.next td{background:var(--nextbg)}tr.next td.t{color:var(--next)}
.mark{color:var(--maru);font-weight:700;font-size:11px}
.stale{background:#fff3cd;color:#664d03;border-radius:8px;padding:8px 10px;font-size:13px;margin-bottom:10px}
@media (prefers-color-scheme:dark){.stale{background:#3a3000;color:#ffe08a}}
</style></head><body><main>

alse}, {"R": 12, "post": "18:10", "name": "ノベンバーカップB2", "n": 12, "fn": "20261116_mizusawa.html", "ven": "水沢", "jra": false}, {"R": 8, "post": "18:20", "name": "スレッジ・ハンマー賞C2十三十四", "n": 14, "fn": "20261116_ooi.html", "ven": "大井", "jra": false}, {"R": 12, "post": "18:45", "name": "楽天競馬で馬券を買おう!楽天競馬特別A1a", "n": 5, "fn": "20261116_kanazawa.html", "ven": "金沢", "jra": false}, {"R": 9, "post": "18:55", "name": "C2十三十四", "n": 13, "fn": "20261116_ooi.html", "ven": "大井", "jra": false}, {"R": 10, "post": "19:30", "name": "立冬特別C2一選抜", "n": 14, "fn": "20261116_ooi.html", "ven": "大井", "jra": false}, {"R": 11, "post": "20:10", "name": "オフト大郷賞B1一B2一選抜特別", "n": 9, "fn": "20261116_ooi.html", "ven": "大井", "jra": false}, {"R": 12, "post": "20:50", "name": "志村坂賞B3五選抜特別", "n": 14, "fn": "20261116_ooi.html", "ven": "大井", "jra": false}]};
let maru={};
function now(){return new Date()}
function at(p){const [h,m]=p.split(':').map(Number);const d=new Date(D.date+'T00:00:00');d.setHours(h,m,0,0);return d}
function key(v,r){return v+'|'+r}
function draw(){
  const t=now(), today=t.toISOString().slice(0,10)===D.date||(t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0'))===D.date;
  document.getElementById('stale').innerHTML=today?'':'<div class="stale">このページは '+D.date+' の分です（今日の分はまだ作られていません）</div>';
  const nextRow=D.rows.find(x=>at(x.post)>t);
  const nk=nextRow?key(nextRow.ven,nextRow.R):'';
  let h='';
  for(const v of D.venues){
    h+='<div class="card"><div class="ven"><a href="'+v.fn+'">'+v.ven+'</a><span class="tag '+(v.jra?'jra':'nar')+'">'+(v.jra?'中央':'地方')+'</span></div><div class="chips">';
    for(const [r,p] of v.races){
      const k=key(v.ven,r), c=at(p)<=t?'done':(k===nk?'next':''), m=maru[k];
      h+='<a class="chip '+c+'" href="'+v.fn+'#R'+r+'">'+r+'R'+(m&&m.s.startsWith('◎')?'<span class="mark">◎</span>':'')+'<small>'+p+'</small></a>';
    }
    h+='</div></div>';
  }
  document.getElementById('venues').innerHTML=h;
  let rows='';
  for(const x of D.rows){
    const k=key(x.ven,x.R), c=at(x.post)<=t?'done':(k===nk?'next':''), m=maru[k];
    rows+='<tr class="'+c+'" onclick="location.href=\''+x.fn+'#R'+x.R+'\'"><td class="t">'+x.post+'</td><td>'+x.ven+'</td><td class="r">'+x.R+'R</td><td class="nm">'+(x.name||'')+(x.n?'・'+x.n+'頭':'')+'</td><td class="m">'+(m?m.s:'')+'</td></tr>';
  }
  document.getElementById('rows').innerHTML=rows;
}
async function loadMaru(){
  try{
    const j=await (await fetch('live/buy_nar.json?t='+Date.now(),{cache:'no-store'})).json();
    if(j.date!==D.date) return;
    const m={};
    for(const r of j.races||[]){
      const n=(r.bets||[]).length;
      m[key(r.venue,r.race_no)]={s: r.final?(n?'◎確定'+n:'見送り'):(n?'◎予告'+n:'')};
    }
    maru=m;
  }catch(e){}
}
draw();loadMaru().then(draw);
setInterval(draw,30000);setInterval(()=>loadMaru().then(draw),120000);
